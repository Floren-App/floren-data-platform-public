[package]
name = "fdp-desktop"
version = "0.1.0"
description = "Floren Data Platform desktop hub"
edition = "2021"
license = "Apache-2.0"

[lib]
name = "fdp_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[dependencies]
tauri = { version = "2.0", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
