# Builds the platform's images for amd64 clusters and pushes them to GitHub Container Registry:
#   ghcr.io/floren-app/fdp-<image>:<commit sha>   (immutable: what an installation pins)
#   ghcr.io/floren-app/fdp-<image>:main           (the latest build of main)
name: images

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      image:
        description: Image to build (all or one matrix image name)
        default: all
        type: string

permissions:
  contents: read
  packages: write

concurrency:
  group: images-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - { image: control-plane,     context: services/control-plane, dockerfile: services/control-plane/Dockerfile }
          - { image: compute-python,    context: ., dockerfile: images/compute-python/Dockerfile }
          - { image: compute-r,         context: ., dockerfile: images/compute-r/Dockerfile }
          - { image: compute-dbt,       context: ., dockerfile: images/compute-dbt/Dockerfile }
          - { image: airflow,           context: ., dockerfile: images/airflow/Dockerfile }
          - { image: workspace-vscode,  context: ., dockerfile: images/workspace-vscode/Dockerfile }
          - { image: workspace-rstudio, context: ., dockerfile: images/workspace-rstudio/Dockerfile }
          - { image: workspace-sql,     context: ., dockerfile: images/workspace-sql/Dockerfile }
          - { image: web,               context: ., dockerfile: images/web/Dockerfile }
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        if: github.event_name != 'workflow_dispatch' || inputs.image == 'all' || inputs.image == matrix.image
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/floren-app/fdp-${{ matrix.image }}:${{ github.sha }}
            ${{ github.ref == 'refs/heads/main' && format('ghcr.io/floren-app/fdp-{0}:main', matrix.image) || '' }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
