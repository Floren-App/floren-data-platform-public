# The build pipeline. Every pull request and push runs the tests its changes can affect (control plane, SDK,
# provider, web app and editor extension, Helm chart, documentation); release tags, the nightly run, manual runs
# and changes to this file run all of them. After the tests pass:
#   main         builds the images whose inputs changed, with SBOM and provenance, signs them (Sigstore, keyless)
#                and pushes ghcr.io/floren-app/fdp-<image>:<commit sha> and :main; unchanged images get the new
#                tags on their existing, already signed build (found by a content tag of their inputs); every
#                image is rebuilt at least weekly for base-image updates, or on demand (workflow_dispatch rebuild)
#   v1.2.3       also tags the images 1.2.3 and 1.2, and publishes a GitHub release with the signed Helm chart
#                pinned to those images
#   provider-v1.2.3  publishes the OpenTofu provider: Floren-App/terraform-provider-fdp receives the source
#                and tag v1.2.3, and its own workflow builds the signed registry release
# Only Floren-App/floren-data-platform-public publishes (images, releases, provider) and runs nightly; other copies
# of this repository, such as a private development repository or a fork, run the tests only.
name: pipeline

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*', 'provider-v*']
  workflow_dispatch:
    inputs:
      rebuild:
        description: Rebuild every image, even those whose inputs did not change
        type: boolean
        default: false
  schedule:
    - cron: '17 3 * * *'   # nightly: every test, whatever changed

permissions:
  contents: read

concurrency:
  group: pipeline-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  REGISTRY: ghcr.io/floren-app

jobs:
  changes:
    name: Select tests
    if: github.event_name != 'schedule' || github.repository == 'Floren-App/floren-data-platform-public'
    runs-on: ubuntu-24.04
    outputs:
      control-plane: ${{ steps.select.outputs.control-plane }}
      sdk: ${{ steps.select.outputs.sdk }}
      provider: ${{ steps.select.outputs.provider }}
      web: ${{ steps.select.outputs.web }}
      chart: ${{ steps.select.outputs.chart }}
      docs: ${{ steps.select.outputs.docs }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - id: select
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          # Each suite runs when anything its tests read changed. The control-plane tests also render the chart,
          # seed the Compose stack and read the SDK, schemas, examples and image files, so their scope is wide.
          full=false; reason=""
          case "$EVENT" in schedule|workflow_dispatch) full=true; reason="$EVENT run";; esac
          [[ "$GITHUB_REF" == refs/tags/* ]] && { full=true; reason="release tag"; }
          range=""
          if [ "$full" = false ]; then
            if [ -n "$PR_BASE" ]; then range="$PR_BASE...HEAD"
            elif [[ -n "$BEFORE" && ! "$BEFORE" =~ ^0+$ ]] && git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then range="$BEFORE..HEAD"
            else full=true; reason="no earlier commit to compare with"; fi
          fi
          changed() { [ "$full" = true ] || ! git diff --quiet "$range" -- "$@"; }
          if [ "$full" = false ] && changed .github/workflows/pipeline.yml; then full=true; reason="the pipeline changed"; fi
          suite() {
            if changed "${@:2}"; then echo "$1=true" >> "$GITHUB_OUTPUT"; echo "| $1 | runs |" >> "$GITHUB_STEP_SUMMARY"
            else echo "$1=false" >> "$GITHUB_OUTPUT"; echo "| $1 | skipped: nothing it tests changed |" >> "$GITHUB_STEP_SUMMARY"; fi
          }
          { echo "### Tests for this change"; [ "$full" = true ] && echo "All suites: $reason."; echo; echo "| Suite | |"; echo "|---|---|"; } >> "$GITHUB_STEP_SUMMARY"
          suite control-plane services/control-plane deploy sdk schemas images examples terraform scripts
          suite sdk sdk/python examples/kafka
          suite provider terraform/provider-fdp docs/reference/terraform
          suite web apps/desktop extensions/vscode-fdp
          suite chart deploy/helm scripts/release_chart.py
          suite docs docs mkdocs.yml requirements-docs.txt scripts

  control-plane:
    name: Control plane tests
    needs: changes
    if: needs.changes.outputs.control-plane == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: services/control-plane/pyproject.toml
      - uses: azure/setup-helm@v4
        with: { version: v3.16.4 }
      - name: Chart dependencies (the chart tests render it)
        run: |
          helm repo add traefik https://traefik.github.io/charts
          helm repo add strimzi https://strimzi.io/charts/
          helm dependency build deploy/helm/fdp
      - run: pip install -e 'services/control-plane[dev]'
      - working-directory: services/control-plane
        run: python -m pytest -q -n auto   # in parallel: the tests share no state across processes

  sdk:
    name: Python SDK tests
    needs: changes
    if: needs.changes.outputs.sdk == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12', cache: pip, cache-dependency-path: sdk/python/pyproject.toml }
      - run: pip install -e 'sdk/python[all]' pytest
      - working-directory: sdk/python
        run: python -m pytest -q

  kafka:
    name: Kafka TLS, OAuth and IAM integration
    needs: changes
    if: needs.changes.outputs.control-plane == 'true' || needs.changes.outputs.sdk == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12', cache: pip, cache-dependency-path: services/control-plane/pyproject.toml }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21', cache: maven, cache-dependency-path: images/kafka/authorizer/pom.xml }
      - run: pip install -e 'services/control-plane[dev]' -e 'sdk/python[kafka]'
      - working-directory: images/kafka/authorizer
        run: mvn -B -Pintegration verify dependency:build-classpath -Dmdep.outputFile="$RUNNER_TEMP/kafka-classpath"
      - name: Real KRaft broker, isolated temporary data
        env:
          FDP_KAFKA_TEST_CLASSPATH: ${{ runner.temp }}/kafka-classpath
        run: python -m pytest services/control-plane/tests/test_kafka_broker.py -q

  provider:
    name: OpenTofu provider
    needs: changes
    if: needs.changes.outputs.provider == 'true'
    runs-on: ubuntu-24.04
    defaults:
      run: { working-directory: terraform/provider-fdp }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version-file: terraform/provider-fdp/go.mod, cache-dependency-path: terraform/provider-fdp/go.sum }
      - run: go vet ./...
      - run: go test ./...
      - name: Generated schema reference is current
        run: |
          go run ./cmd/docs "$RUNNER_TEMP/reference"
          diff -r "$RUNNER_TEMP/reference" ../../docs/reference/terraform

  web:
    name: Web app and editor extension
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            apps/desktop/package-lock.json
            extensions/vscode-fdp/package-lock.json
      - working-directory: apps/desktop
        run: npm ci --no-audit --no-fund && npm run build
      - working-directory: extensions/vscode-fdp
        run: npm ci --no-audit --no-fund && npm run compile

  chart:
    name: Helm chart
    needs: changes
    if: needs.changes.outputs.chart == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
        with: { version: v3.16.4 }
      - run: |
          helm repo add traefik https://traefik.github.io/charts
          helm repo add strimzi https://strimzi.io/charts/
          helm dependency build deploy/helm/fdp
      - name: Lint and render every example profile
        run: |
          for profile in deploy/helm/fdp/examples/*.yaml; do
            helm lint deploy/helm/fdp -f "$profile" --quiet
            helm template fdp deploy/helm/fdp -n fdp -f "$profile" > /dev/null
          done
      - name: A release rewrite keeps the chart valid
        run: |
          cp -r deploy/helm/fdp "$RUNNER_TEMP/chart"
          python3 scripts/release_chart.py 0.0.0-ci --chart "$RUNNER_TEMP/chart"
          helm template fdp "$RUNNER_TEMP/chart" -n fdp -f "$RUNNER_TEMP/chart/examples/minimal.yaml" > /dev/null

  docs:
    name: Documentation
    needs: changes
    if: needs.changes.outputs.docs == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12', cache: pip, cache-dependency-path: requirements-docs.txt }
      - run: pip install -r requirements-docs.txt
      - run: python -m mkdocs build --strict && python scripts/check_docs.py site

  images:
    name: Image ${{ matrix.image }}
    needs: [changes, control-plane, sdk, kafka, provider, web, chart, docs]
    # After the selected tests: none may have failed (skipped ones did not apply to this change).
    if: >-
      always() && !cancelled() && !contains(needs.*.result, 'failure')
      && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
      && !startsWith(github.ref, 'refs/tags/provider-v')
      && github.repository == 'Floren-App/floren-data-platform-public'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      id-token: write          # keyless Sigstore signing
    strategy:
      fail-fast: false
      matrix:
        include:
          # inputs: every file the image is built from; an image is rebuilt only when they change.
          - { image: control-plane,     context: services/control-plane, dockerfile: services/control-plane/Dockerfile,
              inputs: services/control-plane/app services/control-plane/pyproject.toml services/control-plane/Dockerfile }
          - { image: kafka, context: ., dockerfile: images/kafka/Dockerfile, inputs: images/kafka }
          - { image: compute-python,    context: ., dockerfile: images/compute-python/Dockerfile, inputs: images/compute-python sdk/python }
          - { image: compute-r,         context: ., dockerfile: images/compute-r/Dockerfile,
              inputs: images/compute-r sdk/python sdk/r/fdp images/common/Rprofile-packages.site }
          - { image: compute-dbt,       context: ., dockerfile: images/compute-dbt/Dockerfile, inputs: images/compute-dbt sdk/python }
          - { image: airflow,           context: ., dockerfile: images/airflow/Dockerfile, inputs: images/airflow sdk/python }
          - { image: workspace-vscode,  context: ., dockerfile: images/workspace-vscode/Dockerfile,
              inputs: images/workspace-vscode images/common schemas extensions/vscode-fdp sdk/python }
          - { image: workspace-rstudio, context: ., dockerfile: images/workspace-rstudio/Dockerfile,
              inputs: images/workspace-rstudio images/common sdk/python sdk/r/fdp }
          - { image: workspace-sql,     context: ., dockerfile: images/workspace-sql/Dockerfile, inputs: images/workspace-sql }
          - { image: web,               context: ., dockerfile: images/web/Dockerfile,
              inputs: "images/web apps/desktop :(exclude)apps/desktop/tests" }
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/fdp-${{ matrix.image }}
          tags: |
            type=sha,format=long,prefix=
            type=raw,value=main,enable=${{ github.ref == 'refs/heads/main' }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
          labels: |
            org.opencontainers.image.licenses=Apache-2.0
      - id: inputs
        name: Find an existing build of the same inputs
        env: { INPUTS: '${{ matrix.inputs }}' }
        run: |
          # A content tag: the hash of every input file's blob id and the ISO week, so equal inputs give the same
          # tag, and every image is still rebuilt weekly for base-image security updates (or on demand).
          [ "${{ inputs.rebuild }}" = true ] && week="run-$GITHUB_RUN_ID" || week="$(date -u +%G-W%V)"
          tag="inputs-$({ git ls-files -s -- $INPUTS; echo "$week"; } | sha256sum | cut -c1-20)"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if docker buildx imagetools inspect "$REGISTRY/fdp-${{ matrix.image }}:$tag" > /dev/null 2>&1; then
            echo "reuse=true" >> "$GITHUB_OUTPUT"
            echo "${{ matrix.image }}: inputs unchanged; reusing the signed build $tag" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "reuse=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Tag the existing build for this commit
        if: steps.inputs.outputs.reuse == 'true'
        env: { TAGS: '${{ steps.meta.outputs.tags }}' }
        run: |
          args=(); for tag in $TAGS; do args+=(-t "$tag"); done
          docker buildx imagetools create "${args[@]}" "$REGISTRY/fdp-${{ matrix.image }}:${{ steps.inputs.outputs.tag }}"
      - id: build
        if: steps.inputs.outputs.reuse != 'true'
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: true
          tags: |
            ${{ steps.meta.outputs.tags }}
            ${{ env.REGISTRY }}/fdp-${{ matrix.image }}:${{ steps.inputs.outputs.tag }}
          labels: ${{ steps.meta.outputs.labels }}
          sbom: true
          provenance: mode=max
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
      - uses: sigstore/cosign-installer@v3
        if: steps.inputs.outputs.reuse != 'true'
      - name: Sign the image (keyless, recorded in the public transparency log)
        if: steps.inputs.outputs.reuse != 'true'
        run: cosign sign --yes "${REGISTRY}/fdp-${{ matrix.image }}@${{ steps.build.outputs.digest }}"

  release:
    name: Release ${{ github.ref_name }}
    needs: images
    if: startsWith(github.ref, 'refs/tags/v') && github.repository == 'Floren-App/floren-data-platform-public'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
        with: { version: v3.16.4 }
      - uses: sigstore/cosign-installer@v3
      - name: Package the chart pinned to this release's images
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          python3 scripts/release_chart.py "$VERSION"
          helm repo add traefik https://traefik.github.io/charts
          helm repo add strimzi https://strimzi.io/charts/
          helm dependency build deploy/helm/fdp
          helm package deploy/helm/fdp -d dist
          cosign sign-blob --yes --bundle "dist/fdp-$VERSION.tgz.sigstore.json" "dist/fdp-$VERSION.tgz"
          (cd dist && sha256sum * > SHA256SUMS)
      - name: Publish the release
        env: { GH_TOKEN: '${{ secrets.GITHUB_TOKEN }}' }
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --generate-notes \
            --title "Floren Data Platform ${GITHUB_REF_NAME}"

  provider-release:
    name: Provider ${{ github.ref_name }}
    needs: provider
    if: startsWith(github.ref, 'refs/tags/provider-v') && github.repository == 'Floren-App/floren-data-platform-public'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: Floren-App/terraform-provider-fdp
          ssh-key: ${{ secrets.PROVIDER_DEPLOY_KEY }}
          path: provider-repo
          fetch-depth: 0
      - name: Sync the provider source, registry docs and license
        run: |
          rsync -a --delete --exclude .git terraform/provider-fdp/ provider-repo/
          cp LICENSE provider-repo/LICENSE
          mkdir -p provider-repo/docs/resources provider-repo/docs/data-sources
          cp docs/reference/terraform/index.md provider-repo/docs/index.md
          for f in docs/reference/terraform/fdp_*.md; do cp "$f" "provider-repo/docs/resources/$(basename "${f#*fdp_}")"; done
          for f in docs/reference/terraform/data_fdp_*.md; do cp "$f" "provider-repo/docs/data-sources/$(basename "${f#*data_fdp_}")"; done
      - name: Tag the provider release
        working-directory: provider-repo
        run: |
          VERSION="v${GITHUB_REF_NAME#provider-v}"
          git config user.name "floren-data-platform pipeline"
          git config user.email "pipeline@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "Provider $VERSION from floren-data-platform-public@${GITHUB_SHA::7}"
          git tag -a "$VERSION" -m "Provider $VERSION"
          git push origin HEAD:main "$VERSION"
