# The build pipeline. Every pull request and push runs the tests: control plane, SDK, provider, web app and
# editor extension, Helm chart and documentation. After the tests pass:
#   main         builds the images, with SBOM and provenance, signs them (Sigstore, keyless) and pushes
#                ghcr.io/floren-app/fdp-<image>:<commit sha> and :main
#   v1.2.3       also tags the images 1.2.3 and 1.2, and publishes a GitHub release with the signed Helm chart
#                pinned to those images
#   provider-v1.2.3  publishes the OpenTofu provider: Floren-App/terraform-provider-fdp receives the source
#                and tag v1.2.3, and its own workflow builds the signed registry release
name: pipeline

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*', 'provider-v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pipeline-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  REGISTRY: ghcr.io/floren-app

jobs:
  control-plane:
    name: Control plane tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: services/control-plane/pyproject.toml
      - uses: azure/setup-helm@v4
        with: { version: v3.16.4 }
      - name: Chart dependencies (the chart tests render it)
        run: |
          helm repo add traefik https://traefik.github.io/charts
          helm dependency build deploy/helm/fdp
      - run: pip install -e 'services/control-plane[dev]'
      - working-directory: services/control-plane
        run: python -m pytest -q

  sdk:
    name: Python SDK tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12', cache: pip, cache-dependency-path: sdk/python/pyproject.toml }
      - run: pip install -e 'sdk/python[all]' pytest
      - working-directory: sdk/python
        run: python -m pytest -q

  provider:
    name: OpenTofu provider
    runs-on: ubuntu-24.04
    defaults:
      run: { working-directory: terraform/provider-fdp }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version-file: terraform/provider-fdp/go.mod, cache-dependency-path: terraform/provider-fdp/go.sum }
      - run: go vet ./...
      - run: go test ./...
      - name: Generated schema reference is current
        run: |
          go run ./cmd/docs "$RUNNER_TEMP/reference"
          diff -r "$RUNNER_TEMP/reference" ../../docs/reference/terraform

  web:
    name: Web app and editor extension
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            apps/desktop/package-lock.json
            extensions/vscode-fdp/package-lock.json
      - working-directory: apps/desktop
        run: npm ci --no-audit --no-fund && npm run build
      - working-directory: extensions/vscode-fdp
        run: npm ci --no-audit --no-fund && npm run compile

  chart:
    name: Helm chart
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
        with: { version: v3.16.4 }
      - run: |
          helm repo add traefik https://traefik.github.io/charts
          helm dependency build deploy/helm/fdp
      - name: Lint and render every example profile
        run: |
          for profile in deploy/helm/fdp/examples/*.yaml; do
            helm lint deploy/helm/fdp -f "$profile" --quiet
            helm template fdp deploy/helm/fdp -n fdp -f "$profile" > /dev/null
          done
      - name: A release rewrite keeps the chart valid
        run: |
          cp -r deploy/helm/fdp "$RUNNER_TEMP/chart"
          python3 scripts/release_chart.py 0.0.0-ci --chart "$RUNNER_TEMP/chart"
          helm template fdp "$RUNNER_TEMP/chart" -n fdp -f "$RUNNER_TEMP/chart/examples/minimal.yaml" > /dev/null

  docs:
    name: Documentation
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12', cache: pip, cache-dependency-path: requirements-docs.txt }
      - run: pip install -r requirements-docs.txt
      - run: python -m mkdocs build --strict && python scripts/check_docs.py site

  images:
    name: Image ${{ matrix.image }}
    needs: [control-plane, sdk, provider, web, chart, docs]
    if: github.event_name != 'pull_request' && !startsWith(github.ref, 'refs/tags/provider-v')
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      id-token: write          # keyless Sigstore signing
    strategy:
      fail-fast: false
      matrix:
        include:
          - { image: control-plane,     context: services/control-plane, dockerfile: services/control-plane/Dockerfile }
          - { image: compute-python,    context: ., dockerfile: images/compute-python/Dockerfile }
          - { image: compute-r,         context: ., dockerfile: images/compute-r/Dockerfile }
          - { image: compute-dbt,       context: ., dockerfile: images/compute-dbt/Dockerfile }
          - { image: airflow,           context: ., dockerfile: images/airflow/Dockerfile }
          - { image: workspace-vscode,  context: ., dockerfile: images/workspace-vscode/Dockerfile }
          - { image: workspace-rstudio, context: ., dockerfile: images/workspace-rstudio/Dockerfile }
          - { image: workspace-sql,     context: ., dockerfile: images/workspace-sql/Dockerfile }
          - { image: web,               context: ., dockerfile: images/web/Dockerfile }
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/fdp-${{ matrix.image }}
          tags: |
            type=sha,format=long,prefix=
            type=raw,value=main,enable=${{ github.ref == 'refs/heads/main' }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
          labels: |
            org.opencontainers.image.licenses=Apache-2.0
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          sbom: true
          provenance: mode=max
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
      - uses: sigstore/cosign-installer@v3
      - name: Sign the image (keyless, recorded in the public transparency log)
        run: cosign sign --yes "${REGISTRY}/fdp-${{ matrix.image }}@${{ steps.build.outputs.digest }}"

  release:
    name: Release ${{ github.ref_name }}
    needs: images
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
        with: { version: v3.16.4 }
      - uses: sigstore/cosign-installer@v3
      - name: Package the chart pinned to this release's images
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          python3 scripts/release_chart.py "$VERSION"
          helm repo add traefik https://traefik.github.io/charts
          helm dependency build deploy/helm/fdp
          helm package deploy/helm/fdp -d dist
          cosign sign-blob --yes --bundle "dist/fdp-$VERSION.tgz.sigstore.json" "dist/fdp-$VERSION.tgz"
          (cd dist && sha256sum * > SHA256SUMS)
      - name: Publish the release
        env: { GH_TOKEN: '${{ secrets.GITHUB_TOKEN }}' }
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --generate-notes \
            --title "Floren Data Platform ${GITHUB_REF_NAME}"

  provider-release:
    name: Provider ${{ github.ref_name }}
    needs: provider
    if: startsWith(github.ref, 'refs/tags/provider-v')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: Floren-App/terraform-provider-fdp
          ssh-key: ${{ secrets.PROVIDER_DEPLOY_KEY }}
          path: provider-repo
          fetch-depth: 0
      - name: Sync the provider source, registry docs and license
        run: |
          rsync -a --delete --exclude .git terraform/provider-fdp/ provider-repo/
          cp LICENSE provider-repo/LICENSE
          mkdir -p provider-repo/docs/resources provider-repo/docs/data-sources
          cp docs/reference/terraform/index.md provider-repo/docs/index.md
          for f in docs/reference/terraform/fdp_*.md; do cp "$f" "provider-repo/docs/resources/$(basename "${f#*fdp_}")"; done
          for f in docs/reference/terraform/data_fdp_*.md; do cp "$f" "provider-repo/docs/data-sources/$(basename "${f#*data_fdp_}")"; done
      - name: Tag the provider release
        working-directory: provider-repo
        run: |
          VERSION="v${GITHUB_REF_NAME#provider-v}"
          git config user.name "floren-data-platform pipeline"
          git config user.email "pipeline@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "Provider $VERSION from floren-data-platform-public@${GITHUB_SHA::7}"
          git tag -a "$VERSION" -m "Provider $VERSION"
          git push origin HEAD:main "$VERSION"
