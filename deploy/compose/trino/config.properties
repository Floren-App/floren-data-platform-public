coordinator=true
node-scheduler.include-coordinator=true
http-server.http.port=8080
discovery.uri=http://trino:8080
http-server.authentication.type=JWT
http-server.authentication.allow-insecure-over-http=true
http-server.authentication.jwt.key-file=/etc/trino/gateway.hmac
http-server.authentication.jwt.required-issuer=fdp-sql
http-server.authentication.jwt.required-audience=trino
internal-communication.shared-secret=dev-only-internal-trino-secret-change-me
query.max-memory=1GB
query.max-memory-per-node=512MB
query.max-run-time=1h
protocol.spooling.enabled=false
