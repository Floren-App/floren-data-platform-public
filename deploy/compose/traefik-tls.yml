# Local development certificate (generated by `make certs` with mkcert).
tls:
  stores:
    default:
      defaultCertificate:
        certFile: /certs/localhost.pem
        keyFile: /certs/localhost-key.pem
  # Internal APIs (/gw/...): ask for a client certificate but do not require one. Each API decides
  # whether mTLS is required and which CA it trusts; the control plane verifies the forwarded certificate.
  options:
    api-gateway:
      clientAuth:
        clientAuthType: RequestClientCert
