{{- if .Values.bootstrap.enabled }}
{{- $old := lookup "v1" "Secret" .Release.Namespace .Values.existingSecret }}
{{- $data := dict }}
{{- if $old }}{{- $data = deepCopy $old.data }}{{- end }}
{{- range $key := list "FDP_SESSION_SIGNING_KEY" "FDP_GATEWAY_CONFIG_TOKEN" "FDP_TRINO_SIGNING_KEY" "FDP_SCIM_TOKEN" }}
{{- if and $old (not (hasKey $data $key)) }}
{{- fail (printf "retained platform Secret is missing %s; restore its original value before upgrading" $key) }}
{{- end }}
{{- if not (hasKey $data $key) }}{{- $_ := set $data $key (randAlphaNum 64 | b64enc) }}{{- end }}
{{- end }}
{{- /* Added after the first release: generated on upgrade too. Layer Trinos get only its public JWKS. */}}
{{- if not (hasKey $data "FDP_METRICS_TOKEN") }}
{{- $_ := set $data "FDP_METRICS_TOKEN" (randAlphaNum 48 | b64enc) }}
{{- end }}
{{- if not (hasKey $data "FDP_TRINO_JWT_PRIVATE_KEY") }}
{{- $_ := set $data "FDP_TRINO_JWT_PRIVATE_KEY" (genPrivateKey "ecdsa" | b64enc) }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.existingSecret }}
  namespace: {{ .Release.Namespace }}
  annotations: { helm.sh/resource-policy: keep }
type: Opaque
data: {{- toYaml $data | nindent 2 }}
{{- if .Values.trino.enabled }}
{{- $trino := lookup "v1" "Secret" .Release.Namespace .Values.trino.existingSecret }}
{{- $hmac := index $data "FDP_TRINO_SIGNING_KEY" | b64dec | b64enc | b64enc }}
{{- if and $trino (ne (default "" (index $trino.data "gateway.hmac")) $hmac) }}
{{- fail "retained Trino signing key does not match the platform Secret; coordinate key rotation before upgrading" }}
{{- end }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.trino.existingSecret }}
  namespace: {{ .Release.Namespace }}
  annotations: { helm.sh/resource-policy: keep }
type: Opaque
data:
  gateway.hmac: {{ $hmac | quote }}
  internal-secret: {{ if $trino }}{{ required "retained Trino Secret is missing internal-secret" (index $trino.data "internal-secret") | quote }}{{ else }}{{ randAlphaNum 64 | b64enc | quote }}{{ end }}
{{- $catalogs := lookup "v1" "Secret" .Release.Namespace .Values.trino.catalogSecret }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.trino.catalogSecret }}
  namespace: {{ .Release.Namespace }}
  annotations: { helm.sh/resource-policy: keep }
type: Opaque
data: {{ if $catalogs }}{{ toJson $catalogs.data }}{{ else }}{}{{ end }}
{{- end }}
{{- end }}
