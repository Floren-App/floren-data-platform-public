{{- if eq .Values.secretManagement.backend "kubernetes" }}
{{- $namespace := include "fdp.secretNamespace" . }}
{{- if or (eq $namespace .Release.Namespace) (eq $namespace .Values.runtime.namespace) }}
{{- fail "Kubernetes secret storage requires a dedicated namespace, separate from platform and workloads" }}
{{- end }}
apiVersion: v1
kind: Namespace
metadata:
  name: {{ $namespace }}
  annotations: { helm.sh/resource-policy: keep }
  labels:
    pod-security.kubernetes.io/enforce: restricted
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: fdp-secret-store
  namespace: {{ $namespace }}
rules:
  - apiGroups: [""]
    resources: [secrets]
    verbs: [get, create, update, delete]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: fdp-secret-store
  namespace: {{ $namespace }}
subjects:
  - kind: ServiceAccount
    name: fdp-control-plane
    namespace: {{ .Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: fdp-secret-store
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: no-pod-traffic
  namespace: {{ $namespace }}
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
  ingress: []
  egress: []
{{- end }}
