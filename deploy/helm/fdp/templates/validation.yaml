{{- if eq .Values.runtime.namespace .Release.Namespace }}
{{- fail "runtime.namespace must differ from the platform release namespace" }}
{{- end }}
{{- if and .Values.keycloak.enabled (not .Values.metadataDatabase.enabled) (not .Values.keycloak.database.existingSecret) }}
{{- fail "bundled Keycloak requires metadataDatabase.enabled or keycloak.database.existingSecret" }}
{{- end }}
{{- if .Values.keycloak.enabled }}
{{- if not (hasPrefix "https://" .Values.keycloak.publicUrl) }}
{{- fail "keycloak.publicUrl must be an HTTPS URL; configure a trusted certificate or external TLS termination" }}
{{- end }}
{{- $idpHost := regexReplaceAll ":[0-9]+$" (urlParse .Values.keycloak.publicUrl).host "" }}
{{- $appHost := regexReplaceAll ":[0-9]+$" (urlParse .Values.publicUrl).host "" }}
{{- $apiHost := regexReplaceAll ":[0-9]+$" (urlParse .Values.apiGateway.publicUrl).host "" }}
{{- if or (eq $idpHost $appHost) (eq $idpHost $apiHost) }}
{{- fail "keycloak.publicUrl must have a separate hostname from publicUrl and apiGateway.publicUrl" }}
{{- end }}
{{- if .Values.keycloak.directorySync.enabled }}
{{- if ne .Values.oidc.directoryMode "scim" }}
{{- fail "bundled Keycloak directory synchronization requires oidc.directoryMode=scim" }}
{{- end }}
{{- end }}
{{- end }}
{{- if and .Values.bootstrap.enabled (not .Values.metadataDatabase.enabled) (not .Values.metadataDatabase.connectionSecret) }}
{{- fail "automatic platform bootstrap requires metadataDatabase.enabled or metadataDatabase.connectionSecret" }}
{{- end }}
{{- $backend := .Values.secretManagement.backend }}
{{- $vaultApi := has $backend (list "openbao" "vault") }}
{{- if and .Values.bootstrap.enabled $vaultApi (not .Values.openbao.enabled) (ne .Values.openbao.auth.method "kubernetes") }}
{{- fail "automatic platform bootstrap cannot hold an OpenBao/Vault token or AppRole; use the bundled OpenBao (openbao.enabled), openbao.auth.method=kubernetes, or a managed existingSecret" }}
{{- end }}
{{- if and .Values.openbao.enabled (ne $backend "openbao") }}
{{- fail "openbao.enabled bundles OpenBao as the secret store; it requires secretManagement.backend=openbao" }}
{{- end }}
{{- if .Values.openbao.enabled }}
{{- if and (eq .Values.openbao.seal.mode "kms") (not .Values.openbao.seal.kms.type) }}
{{- fail "openbao.seal.mode=kms requires openbao.seal.kms.type and its config" }}
{{- end }}
{{- if and (eq .Values.openbao.seal.mode "kubernetes") .Values.openbao.seal.kms.type }}
{{- fail "openbao.seal.kms is only used with openbao.seal.mode=kms" }}
{{- end }}
{{- if and (ne .Values.openbao.auth.method "kubernetes") (ne .Values.openbao.auth.method "token") }}
{{- fail "the bundled OpenBao authenticates the control plane with Kubernetes auth; leave openbao.auth.method unset" }}
{{- end }}
{{- end }}
{{- if and (eq $backend "azure") (not .Values.secretManagement.azure.vaultUrl) }}
{{- fail "secretManagement.backend=azure requires secretManagement.azure.vaultUrl" }}
{{- end }}
{{- if and (eq $backend "gcp") (not .Values.secretManagement.gcp.project) }}
{{- fail "secretManagement.backend=gcp requires secretManagement.gcp.project" }}
{{- end }}
{{- if and .Values.metadataDatabase.enabled .Values.metadataSql.bootstrapReader }}
{{- fail "bundled metadata uses a non-superuser app role; set metadataSql.bootstrapReader=false and provision its SELECT-only reader separately" }}
{{- end }}
{{- if .Values.traefik.enabled }}
{{- $gatewaySecret := "" }}
{{- range .Values.traefik.env }}
{{- if eq .name "FDP_GATEWAY_CONFIG_TOKEN" }}
{{- $gatewaySecret = dig "valueFrom" "secretKeyRef" "name" "" . }}
{{- end }}
{{- end }}
{{- if ne $gatewaySecret .Values.existingSecret }}
{{- fail "Traefik's FDP_GATEWAY_CONFIG_TOKEN must reference existingSecret; update traefik.env when using a custom platform Secret" }}
{{- end }}
{{- end }}
{{- /* Every image must name an explicit version: "latest" or no tag makes upgrades unpredictable. */}}
{{- $images := dict "image.tag" (printf "%s:%s" .Values.image.repository (toString .Values.image.tag)) "keycloak.image" .Values.keycloak.image "metadataDatabase.image" .Values.metadataDatabase.image "trino.image" .Values.trino.image "openbao.image" .Values.openbao.image }}
{{- range $key, $ref := .Values.runtime.images }}{{- $_ := set $images (printf "runtime.images.%s" $key) $ref }}{{- end }}
{{- range $name, $ref := $images }}
{{- $tag := regexReplaceAll "^.*?(:([^:/@]+))?(@sha256:[a-f0-9]+)?$" (toString $ref) "${2}" }}
{{- $digest := contains "@sha256:" (toString $ref) }}
{{- if and (not $digest) (or (eq $tag "") (eq $tag "latest")) }}
{{- fail (printf "%s must pin an explicit version (got %q); \"latest\" and untagged images make upgrades unpredictable" $name (toString $ref)) }}
{{- end }}
{{- end }}
{{- if and (gt (int .Values.replicas) 1) (ne .Values.packages.persistence.accessMode "ReadWriteMany") }}
{{- fail "replicas > 1 needs packages.persistence.accessMode=ReadWriteMany (every control plane replica serves the package repository)" }}
{{- end }}

{{- if and .Values.metadataDatabase.airflow.enabled (not .Values.metadataDatabase.enabled) }}
{{- fail "metadataDatabase.airflow.enabled requires metadataDatabase.enabled; external Airflow metadata uses FDP_AIRFLOW_METADATA_URL" }}
{{- end }}
