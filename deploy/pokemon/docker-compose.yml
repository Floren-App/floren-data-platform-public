# Explicit opt-in project storage. Independent databases and engine accounts; no host SQL ports.
volumes:
  pokemon-test-data:
  pokemon-prod-data:
services:
  pokemon-test-db:
    image: postgres:16-alpine
    networks: [data]
    environment:
      POSTGRES_USER: pokemon_admin
      POSTGRES_PASSWORD: ${POKEMON_TEST_ADMIN_PASSWORD:?run deploy/pokemon/setup.py first}
      POSTGRES_DB: pokemon
    volumes: [pokemon-test-data:/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U pokemon_admin -d pokemon']
      interval: 3s
      retries: 20
  pokemon-prod-db:
    image: postgres:16-alpine
    networks: [data]
    environment:
      POSTGRES_USER: pokemon_admin
      POSTGRES_PASSWORD: ${POKEMON_PROD_ADMIN_PASSWORD:?run deploy/pokemon/setup.py first}
      POSTGRES_DB: pokemon
    volumes: [pokemon-prod-data:/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U pokemon_admin -d pokemon']
      interval: 3s
      retries: 20
  trino:
    depends_on:
      pokemon-test-db: {condition: service_healthy}
      pokemon-prod-db: {condition: service_healthy}
    volumes:
      - ../pokemon/trino-catalog:/etc/trino/catalog:ro
